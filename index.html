<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Day Organizer">
    <title>AI Day Organizer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [emails, setEmails] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [events, setEvents] = useState([]);
            const [screen, setScreen] = useState('today');
            const [darkMode, setDarkMode] = useState(false);
            const [selectedEmail, setSelectedEmail] = useState(null);
            const [showImport, setShowImport] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [draftReply, setDraftReply] = useState('');
            const [showCopySuccess, setShowCopySuccess] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);

            useEffect(() => {
                const savedEmails = localStorage.getItem('dayorganizer-emails');
                const savedTasks = localStorage.getItem('dayorganizer-tasks');
                const savedEvents = localStorage.getItem('dayorganizer-events');
                
                if (savedEmails) setEmails(JSON.parse(savedEmails));
                if (savedTasks) setTasks(JSON.parse(savedTasks));
                if (savedEvents) setEvents(JSON.parse(savedEvents));
            }, []);

            useEffect(() => {
                if (emails.length > 0) {
                    localStorage.setItem('dayorganizer-emails', JSON.stringify(emails));
                }
            }, [emails]);

            useEffect(() => {
                if (tasks.length > 0) {
                    localStorage.setItem('dayorganizer-tasks', JSON.stringify(tasks));
                }
            }, [tasks]);

            useEffect(() => {
                if (events.length > 0) {
                    localStorage.setItem('dayorganizer-events', JSON.stringify(events));
                }
            }, [events]);

            const generateAIReply = () => {
                const email = emails.find(e => e.id === selectedEmail);
                if (!email) return;

                setIsGenerating(true);

                // Simulate processing time for better UX
                setTimeout(() => {
                    const firstName = email.sender.split(' ')[0];
                    const subject = email.subject.toLowerCase();
                    const preview = email.preview.toLowerCase();
                    const tags = email.tags ? email.tags.map(t => t.toLowerCase()) : [];
                    
                    let reply = '';
                    
                    // Parent Progress Inquiry
                    if (subject.includes('progress') || subject.includes('how is') || preview.includes('progress') || preview.includes('doing')) {
                        reply = `Hi ${firstName},\n\nThank you for checking in! I'm pleased to share that your child has been making wonderful progress. They've shown consistent improvement in their recent work and are demonstrating strong understanding of the concepts we're covering.\n\nI'd love to discuss their development in more detail. Would you be available for a brief call this week? I can share specific examples of their growth and discuss our next steps.\n\nBest regards,\nAlnoor`;
                    }
                    // Student Work Submission
                    else if (tags.includes('student work') || subject.includes('essay') || subject.includes('homework') || subject.includes('assignment')) {
                        reply = `Hi ${firstName},\n\nThank you for sharing this work with me. I've reviewed it and I'm impressed with the effort and thought that went into it.\n\nI'll provide detailed feedback during our next session. Please feel free to reach out if you have any questions in the meantime.\n\nBest regards,\nAlnoor`;
                    }
                    // Assessment/Scheduling
                    else if (tags.includes('assessment') || subject.includes('assessment') || subject.includes('schedule') || subject.includes('appointment')) {
                        reply = `Hi ${firstName},\n\nThank you for reaching out regarding the assessment. I have everything prepared and I'm looking forward to the session.\n\nThe assessment will be held at our center (2040 Yonge Street Unit 205, Toronto) at the scheduled time. Please don't hesitate to call if you have any questions: (416) 546-5051.\n\nBest regards,\nAlnoor`;
                    }
                    // Missed Class/Absence
                    else if (subject.includes('miss') || subject.includes('absent') || subject.includes('sick') || preview.includes('not attending') || preview.includes('unable to')) {
                        reply = `Hi ${firstName},\n\nThank you for letting me know. I hope your child feels better soon!\n\nWe can definitely arrange a make-up session. I have availability later this week or next week. Would any of those times work for you? Feel free to call the center at (416) 546-5051 to schedule.\n\nWarmly,\nAlnoor`;
                    }
                    // Parent Communication / General Question
                    else if (tags.includes('parent contact') || tags.includes('parent communication')) {
                        reply = `Hi ${firstName},\n\nThank you for reaching out. I appreciate your engagement in your child's learning journey.\n\nI'd be happy to discuss this with you in detail. Would you be available for a brief call this week? Alternatively, feel free to stop by the center and we can chat in person.\n\nBest regards,\nAlnoor`;
                    }
                    // Vendor/Business Outreach
                    else if (tags.includes('vendor outreach') || preview.includes('available to connect') || preview.includes('scheduling link')) {
                        reply = `Hi ${firstName},\n\nThank you for reaching out. I'd be interested in learning more about how this could benefit our center and students.\n\nI'm currently focused on our students but would be open to a brief conversation. Could you send me some additional information about your offering?\n\nBest regards,\nAlnoor`;
                    }
                    // Calendar/Event Notification
                    else if (tags.includes('calendar event') || subject.includes('notification:') || subject.includes('reminder')) {
                        reply = `Hi ${firstName},\n\nThank you for the reminder. I have this event noted on my calendar and everything is prepared.\n\nLooking forward to it!\n\nBest regards,\nAlnoor`;
                    }
                    // High Priority / Urgent
                    else if (email.priority === 'High' || subject.includes('urgent') || subject.includes('asap') || subject.includes('important')) {
                        reply = `Hi ${firstName},\n\nThank you for reaching out. I understand this is important and I want to address it promptly.\n\nCould we schedule a call today or tomorrow to discuss this? Please call me directly at (416) 546-5051 or let me know a time that works best for you.\n\nBest regards,\nAlnoor`;
                    }
                    // Generic/Default Response
                    else {
                        reply = `Hi ${firstName},\n\nThank you for your message. I appreciate you reaching out to me.\n\nI'll review this and get back to you shortly with more details. If this is time-sensitive, please feel free to call the center at (416) 546-5051.\n\nBest regards,\nAlnoor`;
                    }
                    
                    setDraftReply(reply);
                    
                    // Save the generated draft back to the email
                    setEmails(emails.map(e => 
                        e.id === selectedEmail ? {...e, aiDraft: reply} : e
                    ));
                    
                    setIsGenerating(false);
                }, 1500); // 1.5 second delay to simulate AI processing
            };

            const importJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        const emailData = Array.isArray(data) ? data : (data.emails || []);
                        const eventData = data.events || [];
                        
                        const processed = emailData.map((item, i) => ({
                            id: Date.now() + i,
                            sender: item.sender.replace(/<.*>/, '').trim(),
                            senderEmail: item.sender.match(/<(.+?)>/)?.[1] || item.sender,
                            subject: item.subject,
                            preview: item.preview,
                            date: item.received_at,
                            priority: item.tags?.includes('Action Required') ? 'High' : 'Medium',
                            tags: item.tags,
                            aiDraft: '' // Will be generated on demand
                        }));
                        
                        setEmails(processed);
                        setEvents(eventData);
                        setShowImport(false);
                        alert('✅ Imported ' + processed.length + ' emails and ' + eventData.length + ' events!');
                    } catch (err) {
                        alert('❌ Error: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };

            const copyDraftToClipboard = () => {
                const email = emails.find(e => e.id === selectedEmail);
                if (!email) return;
                
                const textToCopy = `To: ${email.senderEmail}\n\n${draftReply}`;
                
                navigator.clipboard.writeText(textToCopy).then(() => {
                    setShowCopySuccess(true);
                    setTimeout(() => setShowCopySuccess(false), 2000);
                }).catch(() => {
                    alert('Copy failed. Please copy manually.');
                });
            };

            const deleteEvent = (eventId) => {
                if (confirm('Delete this event?')) {
                    setEvents(events.filter(e => e.id !== eventId));
                }
            };

            const formatTime = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            };

            const formatDate = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };

            const filteredEmails = emails.filter(e => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return e.sender.toLowerCase().includes(q) || 
                       e.subject.toLowerCase().includes(q) ||
                       e.preview.toLowerCase().includes(q);
            });

            return (
                <div className={darkMode ? 'bg-gray-900 text-white min-h-screen' : 'bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen'}>
                    {showImport && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className={`rounded-3xl p-6 max-w-md w-full ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                <div className="flex justify-between mb-4">
                                    <h2 className="text-xl font-bold">Import JSON</h2>
                                    <button onClick={() => setShowImport(false)} className="text-2xl">&times;</button>
                                </div>
                                <p className="text-sm text-gray-500 mb-4">Upload your daily organizer data</p>
                                <input type="file" accept=".json" onChange={importJSON} className="w-full p-3 rounded-xl border" />
                            </div>
                        </div>
                    )}

                    {showCopySuccess && (
                        <div className="fixed top-20 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-xl shadow-lg z-50">
                            ✅ Copied to clipboard!
                        </div>
                    )}

                    {screen === 'today' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80 border-gray-800' : 'bg-white/80 border-gray-200'}`}>
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h1 className="text-3xl font-bold">Good Morning</h1>
                                        <p className="text-sm text-gray-500 mt-1">Saturday, November 16, 2025</p>
                                    </div>
                                    <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg bg-gray-200">
                                        {darkMode ? '☀️' : '🌙'}
                                    </button>
                                </div>
                            </div>

                            <div className="p-6 space-y-6">
                                <div className={`rounded-2xl p-6 border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white/50 border-gray-200'}`}>
                                    <h2 className="text-xl font-bold mb-4">🎯 Priority Today</h2>
                                    {tasks.filter(t => !t.done).slice(0, 3).map(task => (
                                        <div key={task.id} className="flex items-center gap-3 p-3 rounded-xl bg-gray-50 mb-2">
                                            <input type="checkbox" checked={task.done} onChange={() => {
                                                setTasks(tasks.map(t => t.id === task.id ? {...t, done: !t.done} : t));
                                            }} className="w-5 h-5" />
                                            <span>{task.text}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => setScreen('inbox')} className="bg-blue-500 text-white p-4 rounded-xl font-medium">
                                        📧 Inbox ({emails.length})
                                    </button>
                                    <button onClick={() => setScreen('calendar')} className="bg-purple-500 text-white p-4 rounded-xl font-medium">
                                        📅 Calendar ({events.length})
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {screen === 'inbox' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <div className="flex justify-between items-center mb-4">
                                    <h1 className="text-2xl font-bold">📧 Inbox</h1>
                                    <button onClick={() => setShowImport(true)} className="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium">
                                        📤 Upload
                                    </button>
                                </div>
                                
                                <div className={`flex items-center gap-2 px-4 py-3 rounded-xl ${darkMode ? 'bg-gray-800' : 'bg-gray-100'}`}>
                                    <span className="text-xl">🔍</span>
                                    <input 
                                        type="text" 
                                        placeholder="Search emails..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="flex-1 bg-transparent outline-none text-sm"
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="text-gray-500">✕</button>
                                    )}
                                </div>
                            </div>

                            <div className="p-4 space-y-3">
                                {filteredEmails.map(email => (
                                    <div key={email.id} onClick={() => { 
                                        setSelectedEmail(email.id); 
                                        setDraftReply(email.aiDraft || 'Click "Generate AI Reply" to create a personalized response...');
                                        setScreen('draft'); 
                                    }}
                                        className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white/50 border-gray-200'}`}>
                                        <div className="flex items-start justify-between mb-2">
                                            <h3 className="font-semibold text-sm flex-1">{email.sender}</h3>
                                            <div className="flex items-center gap-2">
                                                <span className={`text-xs px-2 py-0.5 rounded-full ${email.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                    {email.priority}
                                                </span>
                                                <span className="text-xs text-gray-500">{formatDate(email.date)}</span>
                                            </div>
                                        </div>
                                        <p className="font-medium text-sm mb-1">{email.subject}</p>
                                        <p className="text-xs text-gray-500 mt-1">{email.preview.substring(0, 80)}...</p>
                                    </div>
                                ))}
                                {filteredEmails.length === 0 && (
                                    <div className="text-center py-12 text-gray-500">
                                        {searchQuery ? '🔍 No emails found' : '📭 No emails yet'}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {screen === 'draft' && selectedEmail && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-4 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <button onClick={() => setScreen('inbox')} className="flex items-center gap-2 text-blue-500">
                                    ← Back to Inbox
                                </button>
                            </div>
                            <div className="p-4">
                                {(() => {
                                    const email = emails.find(e => e.id === selectedEmail);
                                    return (
                                        <div className={`rounded-2xl p-5 border ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}>
                                            <div className="mb-4 pb-4 border-b">
                                                <p className="text-sm text-gray-500 mb-1">To:</p>
                                                <p className="font-semibold">{email.sender}</p>
                                                <p className="text-sm text-gray-600">{email.senderEmail}</p>
                                            </div>
                                            
                                            <h2 className="text-xl font-bold mb-4">🤖 AI-Powered Reply</h2>
                                            
                                            <button 
                                                onClick={generateAIReply}
                                                disabled={isGenerating}
                                                className={`w-full mb-4 py-3 rounded-xl font-semibold ${
                                                    isGenerating 
                                                        ? 'bg-gray-400 cursor-not-allowed' 
                                                        : 'bg-gradient-to-r from-purple-500 to-blue-500 hover:from-purple-600 hover:to-blue-600 text-white'
                                                }`}>
                                                {isGenerating ? '⏳ Generating AI Reply...' : '✨ Generate AI Reply'}
                                            </button>
                                            
                                            <textarea 
                                                value={draftReply}
                                                onChange={(e) => setDraftReply(e.target.value)}
                                                placeholder="AI reply will appear here..."
                                                className="w-full p-4 rounded-xl border min-h-64 bg-gray-50 text-sm"
                                            />
                                            <div className="flex gap-3 mt-4">
                                                <button 
                                                    onClick={copyDraftToClipboard}
                                                    className="flex-1 bg-blue-500 text-white px-6 py-3 rounded-xl font-semibold">
                                                    📋 Copy Email & Reply
                                                </button>
                                                <button 
                                                    onClick={() => setScreen('inbox')}
                                                    className={`px-6 py-3 rounded-xl font-semibold ${darkMode ? 'bg-gray-700' : 'bg-gray-200'}`}>
                                                    Done
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {screen === 'tasks' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <h1 className="text-2xl font-bold">✅ Tasks</h1>
                            </div>
                            <div className="p-4 space-y-3">
                                {tasks.map(task => (
                                    <div key={task.id} className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}>
                                        <div className="flex items-center gap-3">
                                            <input type="checkbox" checked={task.done} onChange={() => {
                                                setTasks(tasks.map(t => t.id === task.id ? {...t, done: !t.done} : t));
                                            }} className="w-6 h-6" />
                                            <span className={task.done ? 'line-through' : ''}>{task.text}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {screen === 'calendar' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <h1 className="text-2xl font-bold">📅 Calendar - Next 30 Days</h1>
                                <p className="text-sm text-gray-500 mt-1">{events.length} events</p>
                            </div>
                            <div className="p-4 space-y-3">
                                {events.length > 0 ? events.map((event, idx) => {
                                    const eventDate = new Date(event.start);
                                    const showDate = idx === 0 || new Date(events[idx-1].start).toDateString() !== eventDate.toDateString();
                                    
                                    return (
                                        <div key={event.id}>
                                            {showDate && (
                                                <div className="text-sm font-bold text-gray-500 mt-4 mb-2">
                                                    {eventDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}
                                                </div>
                                            )}
                                            <div className={`rounded-2xl p-5 border relative ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}>
                                                <div className="flex justify-between items-start">
                                                    <div className="flex-1">
                                                        <h3 className="text-lg font-bold">{event.title}</h3>
                                                        <p className="text-sm text-gray-500 mt-2">🕐 {formatTime(event.start)}</p>
                                                        {event.location && <p className="text-sm text-gray-500 mt-1">📍 {event.location}</p>}
                                                    </div>
                                                    <button 
                                                        onClick={() => deleteEvent(event.id)}
                                                        className="text-red-500 hover:bg-red-50 p-2 rounded-lg ml-2">
                                                        🗑️
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                }) : (
                                    <div className="text-center py-12 text-gray-500">
                                        <p>📅 No events</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <div className={`fixed bottom-0 left-0 right-0 border-t backdrop-blur-xl ${darkMode ? 'bg-gray-900/95 border-gray-800' : 'bg-white/95 border-gray-200'}`}>
                        <div className="flex justify-around p-4">
                            <button onClick={() => setScreen('today')} className={`flex flex-col items-center ${screen === 'today' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">🎯</span>
                                <span className="text-xs mt-1">Today</span>
                            </button>
                            <button onClick={() => setScreen('inbox')} className={`flex flex-col items-center ${screen === 'inbox' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">📧</span>
                                <span className="text-xs mt-1">Inbox</span>
                            </button>
                            <button onClick={() => setScreen('tasks')} className={`flex flex-col items-center ${screen === 'tasks' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">✅</span>
                                <span className="text-xs mt-1">Tasks</span>
                            </button>
                            <button onClick={() => setScreen('calendar')} className={`flex flex-col items-center ${screen === 'calendar' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">📅</span>
                                <span className="text-xs mt-1">Calendar</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
