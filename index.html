    const Icon = ({ name, size = 24, className = '' }) => {
        const icons = {
            mail: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>,
            calendar: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            check: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            target: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            upload: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            sun: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>,
            moon: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>,
            star: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            x: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><path d="M18 6 6 18M6 6l12 12"/></svg>,
            search: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            back: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
            clock: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>

        return icons[name] || null;

    const DayOrganizerPro = () => {
        const [emails, setEmails] = useState([]);
        const [tasks, setTasks] = useState([]);
        const [calendarEvents, setCalendarEvents] = useState([]);
        const [selectedEmail, setSelectedEmail] = useState(null);
        const [draftReply, setDraftReply] = useState('');
        const [currentScreen, setCurrentScreen] = useState('today');
        const [darkMode, setDarkMode] = useState(false);
        const [showImportModal, setShowImportModal] = useState(false);
        const [searchQuery, setSearchQuery] = useState('');

        useEffect(() => {
            const sampleEmails = [
                {
                    id: 1,
                    sender: "Ramandeep Kaur",
                    subject: "Ronith's Essay",
                    preview: "Please find this week's essay attached.",
                    priority: "Medium",
                    status: "pending",
                    starred: false,
                    aiDraft: "Dear Ramandeep,\n\nThank you for sharing Ronith's essay. I've reviewed it and will provide feedback during our next session.\n\nBest regards,\nAlnoor"
                },
                {
                    id: 2,
                    sender: "Sarah Johnson",
                    subject: "Math Progress Question",
                    preview: "I wanted to check in about Emma's assessments...",
                    priority: "High",
                    status: "pending",
                    starred: true,
                    aiDraft: "Hi Sarah,\n\nThank you for reaching out. Emma is doing wonderfully. Would Thursday work for a call?\n\nBest regards,\nAlnoor"
                }
            ];
            setEmails(sampleEmails);

            const sampleTasks = [
                { id: 1, text: "Review Ronith's essay", completed: false, priority: "High" },
                { id: 2, text: "Prepare assessment materials", completed: false, priority: "High" }
            ];
            setTasks(sampleTasks);

            const sampleEvents = [
                {
                    id: 1,
                    title: "Farman class",
                    start: "2025-11-16T04:00:00-08:00",
                    end: "2025-11-16T05:00:00-08:00",
                    location: "Online",
                    type: "class"
                }
            ];
            setCalendarEvents(sampleEvents);
        }, []);

        const handleImportJSON = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    let emailData = Array.isArray(data) ? data : (data.emails || []);
                    let eventData = data.events || [];
                    
                    const processed = emailData.map((item, idx) => ({
                        id: Date.now() + idx,
                        sender: item.sender.replace(/<.*>/, '').trim(),
                        subject: item.subject,
                        preview: item.preview,
                        priority: (item.tags && item.tags.includes('Action Required')) ? 'High' : 'Medium',
                        status: 'pending',
                        starred: false,
                        aiDraft: `Hi,\n\nThank you for your message. I will review this and get back to you.\n\nBest regards,\nAlnoor`
                    }));
                    
                    setEmails(processed);
                    
                    if (eventData.length > 0) {
                        setCalendarEvents(eventData);
                    }
                    
                    setShowImportModal(false);
                    alert('Imported ' + processed.length + ' emails' + (eventData.length > 0 ? ' and ' + eventData.length + ' events!' : '!'));
                } catch (err) {
                    alert('Error importing file: ' + err.message);
                }
            };
            reader.readAsText(file);
        };

        const toggleTask = (id) => {
            setTasks(tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t));
        };

        const selectEmail = (id) => {
            const email = emails.find(e => e.id === id);
            setSelectedEmail(id);
            setDraftReply(email.aiDraft);
            setCurrentScreen('draft');
        };

        const formatTime = (dateString) => {
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        };

        const pendingTasks = tasks.filter(t => !t.completed);

        return (
            <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-white' : 'bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50'}`}>
                {showImportModal && (
                    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                        <div className={`rounded-3xl p-6 max-w-md w-full ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-bold">Import JSON</h2>
                                <button onClick={() => setShowImportModal(false)}>
                                    <Icon name="x" size={24} />
                                </button>
                            </div>
                            <p className="text-sm mb-4 text-gray-500">Upload your daily organizer data file</p>
                            <input type="file" accept=".json" onChange={handleImportJSON} 
                                className={`w-full p-3 rounded-xl border-2 ${darkMode ? 'bg-gray-700' : 'bg-gray-50'}`} />
                        </div>
                    </div>
                )}

                {currentScreen === 'today' && (
                    <div className="pb-24">
                        <div className={`sticky top-0 backdrop-blur-xl ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'} border-b p-6`}>
                            <div className="flex justify-between items-center mb-2">
                                <h1 className="text-3xl font-bold">Good Morning</h1>
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2">
                                    <Icon name={darkMode ? "sun" : "moon"} size={20} />
                                </button>
                            </div>
                            <p className="text-sm text-gray-500">Saturday, November 16, 2025</p>
                        </div>

                        <div className="p-6 space-y-6">
                            <div className={`rounded-2xl p-6 ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'} border`}>
                                <div className="flex items-center gap-2 mb-4">
                                    <Icon name="target" size={24} className="text-blue-500" />
                                    <h2 className="text-xl font-bold">Priority Today</h2>
                                </div>
                                <div className="space-y-3">
                                    {pendingTasks.filter(t => t.priority === 'High').map(task => (
                                        <button key={task.id} onClick={() => toggleTask(task.id)}
                                            className={`w-full flex items-center gap-3 p-3 rounded-xl ${darkMode ? 'bg-gray-700/50' : 'bg-gray-50'}`}>
                                            <div className="w-5 h-5 rounded-full border-2 flex items-center justify-center">
                                                {task.completed && <Icon name="check" size={14} />}
                                            </div>
                                            <span className="flex-1 text-left text-sm">{task.text}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={() => setCurrentScreen('inbox')}
                                    className={`p-4 rounded-xl font-medium ${darkMode ? 'bg-blue-500/20 text-blue-300' : 'bg-blue-500 text-white'}`}>
                                    View Inbox
                                </button>
                                <button onClick={() => setCurrentScreen('tasks')}
                                    className={`p-4 rounded-xl font-medium ${darkMode ? 'bg-purple-500/20 text-purple-300' : 'bg-purple-500 text-white'}`}>
                                    View Tasks
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {currentScreen === 'inbox' && (
                    <div className="pb-24">
                        <div className={`sticky top-0 backdrop-blur-xl ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'} border-b p-6`}>
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-2xl font-bold flex items-center gap-2">
                                    <Icon name="mail" className="text-blue-600" />
                                    Inbox
                                </h1>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowImportModal(true)}
                                        className={`p-2 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-gray-200'}`}>
                                        <Icon name="upload" size={18} />
                                    </button>
                                    <button onClick={() => setDarkMode(!darkMode)}
                                        className={`p-2 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-gray-200'}`}>
                                        <Icon name={darkMode ? "sun" : "moon"} size={18} />
                                    </button>
                                </div>
                            </div>
                            <div className={`flex items-center gap-2 px-4 py-2 rounded-xl ${darkMode ? 'bg-gray-800' : 'bg-gray-100'}`}>
                                <Icon name="search" size={18} />
                                <input type="text" placeholder="Search..." value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="flex-1 bg-transparent outline-none text-sm" />
                            </div>
                        </div>

                        <div className="p-4 space-y-3">
                            {emails.filter(e => !searchQuery || e.sender.toLowerCase().includes(searchQuery.toLowerCase()) || e.subject.toLowerCase().includes(searchQuery.toLowerCase())).map(email => (
                                <div key={email.id} onClick={() => selectEmail(email.id)}
                                    className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white/50 border-gray-200'}`}>
                                    <div className="flex items-center gap-2 mb-1">
                                        <h3 className="font-semibold text-sm">{email.sender}</h3>
                                        <span className={`text-xs px-2 py-0.5 rounded-full ${email.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                            {email.priority}
                                        </span>
                                    </div>
                                    <p className="font-medium text-sm mb-1">{email.subject}</p>
                                    <p className="text-xs text-gray-500">{email.preview}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {currentScreen === 'draft' && selectedEmail && (
                    <div className="pb-24">
                        <div className={`sticky top-0 backdrop-blur-xl ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'} border-b p-4`}>
                            <button onClick={() => setCurrentScreen('inbox')} className="flex items-center gap-2">
                                <Icon name="back" size={18} />
                                Back
                            </button>
                        </div>
                        <div className="p-4">
                            <div className={`rounded-2xl p-5 ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'} border`}>
                                <h2 className="text-xl font-bold mb-4">AI Draft Reply</h2>
                                <textarea value={draftReply} onChange={(e) => setDraftReply(e.target.value)}
                                    className={`w-full p-4 rounded-xl border-2 min-h-64 ${darkMode ? 'bg-gray-900' : 'bg-gray-50'}`} />
                                <button onClick={() => setCurrentScreen('inbox')}
                                    className="w-full mt-4 bg-blue-500 text-white px-6 py-3 rounded-xl font-semibold">
                                    Send & Mark Done
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {currentScreen === 'tasks' && (
                    <div className="pb-24">
                        <div className={`sticky top-0 backdrop-blur-xl ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'} border-b p-6`}>
                            <h1 className="text-2xl font-bold">Tasks</h1>
                        </div>
                        <div className="p-4 space-y-3">
                            {tasks.map(task => (
                                <div key={task.id} className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => toggleTask(task.id)}
                                            className={`w-6 h-6 rounded-full border-2 flex items-center justify-center ${task.completed ? 'bg-green-500' : ''}`}>
                                            {task.completed && <Icon name="check" size={14} className="text-white" />}
                                        </button>
                                        <span className={task.completed ? 'line-through' : ''}>{task.text}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )}

                {currentScreen === 'calendar' && (
                    <div className="pb-24">
                        <div className={`sticky top-0 backdrop-blur-xl ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'} border-b p-6`}>
                            <h1 className="text-2xl font-bold flex items-center gap-2">
                                <Icon name="calendar" className="text-purple-600" />
                                Today's Schedule
                            </h1>
                        </div>
                        <div className="p-4 space-y-3">
                            {calendarEvents.length > 0 ? (
                                calendarEvents.map(event => (
                                    <div key={event.id} className={`rounded-2xl p-5 border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white/50 border-gray-200'}`}>
                                        <h3 className="text-lg font-bold mb-2">{event.title}</h3>
                                        <div className="flex items-center gap-2 text-sm mb-2">
                                            <Icon name="clock" size={16} className="text-blue-500" />
                                            <span>{formatTime(event.start)} - {formatTime(event.end)}</span>
                                        </div>
                                        {event.location && (
                                            <p className="text-sm text-gray-500">📍 {event.location}</p>
                                        )}
                                        {event.description && (
                                            <p className="text-sm mt-2">{event.description}</p>
                                        )}
                                    </div>
                                ))
                            ) : (
                                <div className="text-center py-12">
                                    <p className="text-lg text-gray-500">📅 No events today</p>
                                    <p className="text-sm text-gray-400 mt-2">Import your calendar data to see events here</p>
                                </div>
                            )}
                        </div>
                    </div>
                )}

                <div className={`fixed bottom-0 left-0 right-0 ${darkMode ? 'bg-gray-900/95' : 'bg-white/95'} border-t backdrop-blur-xl`}>
                    <div className="flex justify-around p-4">
                        {[
                            { id: 'today', icon: 'target', label: 'Today' },
                            { id: 'inbox', icon: 'mail', label: 'Inbox' },
                            { id: 'tasks', icon: 'check', label: 'Tasks' },
                            { id: 'calendar', icon: 'calendar', label: 'Calendar' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setCurrentScreen(tab.id)}
                                className={`flex flex-col items-center gap-1 ${currentScreen === tab.id ? 'text-blue-500' : 'text-gray-400'}`}>
                                <Icon name={tab.icon} size={24} />
                                <span className="text-xs">{tab.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        );
    };

    ReactDOM.render(React.createElement(DayOrganizerPro), document.getElementById('root'));
</script>
