<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Optional remote JSON sync (Dropbox etc). Leave null for now.
        const REMOTE_JSON_URL = null;

        const PIN_CODE = "4500";

        function isSameDay(dateStr, refDate = new Date()) {
            if (!dateStr) return false;
            const d = new Date(dateStr);
            return d.getFullYear() === refDate.getFullYear() &&
                   d.getMonth() === refDate.getMonth() &&
                   d.getDate() === refDate.getDate();
        }

        function daysBetween(from, to) {
            const ms = to.getTime() - from.getTime();
            return ms / (1000 * 60 * 60 * 24);
        }

        function parseNaturalSchedule(input, base = new Date()) {
            if (!input || !input.trim()) return null;
            const text = input.trim().toLowerCase();
            const now = base;

            // Defaults
            let target = new Date(now.getTime());

            const weekdayNames = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];

            function setTimeFromToken(t) {
                // Handles things like "2pm", "14:00", "7", "7am", "7 pm"
                const ampmMatch = t.match(/^(\d{1,2})(:(\d{2}))?\s*(am|pm)?$/);
                if (ampmMatch) {
                    let hour = parseInt(ampmMatch[1], 10);
                    const minute = ampmMatch[3] ? parseInt(ampmMatch[3], 10) : 0;
                    const suffix = ampmMatch[4];
                    if (suffix === "pm" && hour < 12) hour += 12;
                    if (suffix === "am" && hour === 12) hour = 0;
                    target.setHours(hour, minute, 0, 0);
                    return;
                }
                // Named windows
                if (t === "morning") {
                    target.setHours(9, 0, 0, 0);
                    return;
                }
                if (t === "afternoon") {
                    target.setHours(14, 0, 0, 0);
                    return;
                }
                if (t === "evening") {
                    target.setHours(19, 0, 0, 0);
                    return;
                }
                if (t === "after school") {
                    target.setHours(16, 0, 0, 0);
                    return;
                }
                if (t === "before dinner") {
                    target.setHours(17, 0, 0, 0);
                    return;
                }
            }

            // Simple relative: "in 2 days", "in 3 hours"
            const inMatch = text.match(/^in\s+(\d+)\s+(day|days|hour|hours)$/);
            if (inMatch) {
                const value = parseInt(inMatch[1], 10);
                const unit = inMatch[2];
                if (unit.startsWith("day")) {
                    target.setDate(target.getDate() + value);
                    target.setHours(9, 0, 0, 0);
                } else {
                    target.setHours(target.getHours() + value);
                }
                return target;
            }

            // "today" variants
            if (text.startsWith("today")) {
                target.setHours(9, 0, 0, 0);
                const tokens = text.split(/\s+/);
                if (tokens.length > 1) {
                    setTimeFromToken(tokens.slice(1).join(" "));
                }
                return target;
            }

            // "tomorrow" variants
            if (text.startsWith("tomorrow")) {
                target.setDate(target.getDate() + 1);
                target.setHours(9, 0, 0, 0);
                const tokens = text.split(/\s+/);
                if (tokens.length > 1) {
                    setTimeFromToken(tokens.slice(1).join(" "));
                }
                return target;
            }

            // "next friday", "next monday 3pm"
            if (text.startsWith("next ")) {
                const tokens = text.split(/\s+/);
                if (tokens.length >= 2) {
                    const weekdayStr = tokens[1];
                    const index = weekdayNames.indexOf(weekdayStr);
                    if (index !== -1) {
                        const currentDay = target.getDay();
                        let diff = (index + 7 - currentDay) % 7;
                        if (diff === 0) diff = 7; // always next week
                        target.setDate(target.getDate() + diff);
                        target.setHours(9, 0, 0, 0);
                        if (tokens.length > 2) {
                            setTimeFromToken(tokens.slice(2).join(" "));
                        }
                        return target;
                    }
                }
            }

            // "monday 2pm"
            for (let i = 0; i < weekdayNames.length; i++) {
                if (text.startsWith(weekdayNames[i])) {
                    const tokens = text.split(/\s+/);
                    const currentDay = target.getDay();
                    let diff = (i + 7 - currentDay) % 7;
                    if (diff === 0) diff = 7;
                    target.setDate(target.getDate() + diff);
                    target.setHours(9, 0, 0, 0);
                    if (tokens.length > 1) {
                        setTimeFromToken(tokens.slice(1).join(" "));
                    }
                    return target;
                }
            }

            // Only a time like "2pm" or "14:00" today
            setTimeFromToken(text);
            return target;
        }

        function getEmailPriorityScore(email, today = new Date()) {
            // Weighted model:
            // base on priority + tags + recency + explicit follow-up
            let score = 0;
            const subject = (email.subject || "").toLowerCase();
            const preview = (email.preview || "").toLowerCase();
            const tags = (email.tags || []).map(t => t.toLowerCase());
            const date = email.followUpAt || email.date;
            const d = date ? new Date(date) : today;
            const daysDiff = Math.abs(daysBetween(today, d));

            // Base on priority
            if (email.priority === "High") score += 40;
            else score += 20;

            // Tags
            if (tags.includes("action required")) score += 40;
            if (tags.includes("parent contact") || tags.includes("parent communication")) score += 25;
            if (tags.includes("assessment")) score += 20;
            if (tags.includes("student work")) score += 15;

            // Content hints
            if (subject.includes("urgent") || subject.includes("asap")) score += 30;
            if (subject.includes("progress") || preview.includes("progress")) score += 20;
            if (preview.includes("let me know") || preview.includes("can you")) score += 10;

            // Recency: closer to today → higher
            if (daysDiff < 1) score += 20;
            else if (daysDiff < 3) score += 10;
            else if (daysDiff < 7) score += 5;

            // Explicit follow up date gets a boost
            if (email.followUpAt && isSameDay(email.followUpAt, today)) score += 30;

            return score;
        }

        function getTaskPriorityScore(task, today = new Date()) {
            let score = 0;

            if (task.done) return 0;

            // Base urgency
            if (task.dueAt) {
                const d = new Date(task.dueAt);
                const diff = daysBetween(today, d);
                if (diff < 0) score += 40;           // overdue
                else if (diff < 0.5) score += 35;    // today
                else if (diff < 2) score += 25;      // next couple of days
                else if (diff < 7) score += 10;      // later this week
            } else {
                score += 10; // no due date but still relevant
            }

            const text = (task.text || "").toLowerCase();
            // Parent/retention tasks get a bump
            if (text.includes("parent") || text.includes("call") || text.includes("email")) score += 20;
            if (text.includes("assessment") || text.includes("enrol") || text.includes("enrollment")) score += 20;
            if (text.includes("staff") || text.includes("training")) score += 10;
            if (text.includes("automation") || text.includes("system")) score += 10;

            return score;
        }

        function App() {
            const [emails, setEmails] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [events, setEvents] = useState([]);
            const [trash, setTrash] = useState([]);
            const [screen, setScreen] = useState('today');
            const [darkMode, setDarkMode] = useState(false);
            const [selectedEmail, setSelectedEmail] = useState(null);
            const [showImport, setShowImport] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [draftReply, setDraftReply] = useState('');
            const [showCopySuccess, setShowCopySuccess] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);

            const [locked, setLocked] = useState(true);
            const [pinInput, setPinInput] = useState("");

            // Undo
            const [showUndo, setShowUndo] = useState(false);
            const [undoInfo, setUndoInfo] = useState(null);
            const undoTimeoutRef = useRef(null);

            // Swipe
            const touchStartXRef = useRef(null);

            // Reschedule modal
            const [rescheduleTarget, setRescheduleTarget] = useState(null);
            const [rescheduleDate, setRescheduleDate] = useState('');
            const [rescheduleTime, setRescheduleTime] = useState('');
            const [rescheduleNatural, setRescheduleNatural] = useState('');

            // Weekly notes
            const [weeklyNotes, setWeeklyNotes] = useState("");
            const [weeklyKey, setWeeklyKey] = useState("");

            useEffect(() => {
                const savedEmails = localStorage.getItem('dayorganizer-emails');
                const savedTasks = localStorage.getItem('dayorganizer-tasks');
                const savedEvents = localStorage.getItem('dayorganizer-events');
                const savedTrash = localStorage.getItem('dayorganizer-trash-emails');

                if (savedEmails) setEmails(JSON.parse(savedEmails));
                if (savedTasks) setTasks(JSON.parse(savedTasks));
                if (savedEvents) setEvents(JSON.parse(savedEvents));
                if (savedTrash) setTrash(JSON.parse(savedTrash));

                // Load weekly notes for current week
                const today = new Date();
                const y = today.getFullYear();
                const week = Math.ceil(((today - new Date(y, 0, 1)) / 86400000 + new Date(y, 0, 1).getDay() + 1) / 7);
                const key = `dayorganizer-weekly-${y}-w${week}`;
                setWeeklyKey(key);
                const storedNotes = localStorage.getItem(key);
                if (storedNotes) setWeeklyNotes(storedNotes);
            }, []);

            // Remote JSON auto-import (optional)
            useEffect(() => {
                const fetchRemote = async () => {
                    if (!REMOTE_JSON_URL) return;
                    try {
                        const res = await fetch(REMOTE_JSON_URL, { cache: 'no-store' });
                        if (!res.ok) return;
                        const data = await res.json();
                        const emailData = Array.isArray(data) ? data : (data.emails || []);
                        const eventData = data.events || [];
                        const taskData = data.tasks || [];

                        const processedEmails = emailData.map((item, i) => ({
                            id: Date.now() + i,
                            sender: (item.sender || '').replace(/<.*>/, '').trim(),
                            senderEmail: (item.sender || '').match(/<(.+?)>/)?.[1] || item.sender || '',
                            subject: item.subject || '',
                            preview: item.preview || '',
                            date: item.received_at || new Date().toISOString(),
                            priority: item.tags?.includes('Action Required') ? 'High' : 'Medium',
                            tags: item.tags || [],
                            aiDraft: item.aiDraft || '',
                            followUpAt: item.followUpAt || null
                        }));
                        const processedTasks = taskData.map((t, i) => ({
                            id: t.id || `task-${Date.now()}-${i}`,
                            text: t.text || '',
                            done: !!t.done,
                            dueAt: t.dueAt || null
                        }));

                        setEmails(processedEmails);
                        setEvents(eventData);
                        setTasks(processedTasks);
                    } catch (e) {
                        console.warn('Remote JSON fetch error', e);
                    }
                };
                fetchRemote();
            }, []);

            useEffect(() => {
                if (emails.length > 0) {
                    localStorage.setItem('dayorganizer-emails', JSON.stringify(emails));
                } else {
                    localStorage.removeItem('dayorganizer-emails');
                }
            }, [emails]);

            useEffect(() => {
                if (tasks.length > 0) {
                    localStorage.setItem('dayorganizer-tasks', JSON.stringify(tasks));
                } else {
                    localStorage.removeItem('dayorganizer-tasks');
                }
            }, [tasks]);

            useEffect(() => {
                if (events.length > 0) {
                    localStorage.setItem('dayorganizer-events', JSON.stringify(events));
                } else {
                    localStorage.removeItem('dayorganizer-events');
                }
            }, [events]);

            useEffect(() => {
                if (trash.length > 0) {
                    localStorage.setItem('dayorganizer-trash-emails', JSON.stringify(trash));
                } else {
                    localStorage.removeItem('dayorganizer-trash-emails');
                }
            }, [trash]);

            useEffect(() => {
                if (weeklyKey) {
                    localStorage.setItem(weeklyKey, weeklyNotes);
                }
            }, [weeklyNotes, weeklyKey]);

            const triggerUndo = (info) => {
                setUndoInfo(info);
                setShowUndo(true);
                if (undoTimeoutRef.current) {
                    clearTimeout(undoTimeoutRef.current);
                }
                undoTimeoutRef.current = setTimeout(() => {
                    setShowUndo(false);
                    setUndoInfo(null);
                }, 5000);
            };

            const handleUndo = () => {
                if (!undoInfo) return;

                if (undoInfo.type === 'fromInbox') {
                    setTrash(prev => prev.filter(e => e.id !== undoInfo.email.id));
                    setEmails(prev => [undoInfo.email, ...prev]);
                } else if (undoInfo.type === 'hardDelete') {
                    setTrash(prev => [undoInfo.email, ...prev]);
                }

                setShowUndo(false);
                setUndoInfo(null);
                if (undoTimeoutRef.current) {
                    clearTimeout(undoTimeoutRef.current);
                }
            };

            const generateAIReply = () => {
                const email = emails.find(e => e.id === selectedEmail);
                if (!email) return;

                setIsGenerating(true);

                setTimeout(() => {
                    const firstName = (email.sender || '').split(' ')[0] || 'there';
                    const subject = (email.subject || '').toLowerCase();
                    const preview = (email.preview || '').toLowerCase();
                    const tags = email.tags ? email.tags.map(t => t.toLowerCase()) : [];
                    
                    let reply = '';
                    
                    if (
                        subject.includes('progress') || 
                        subject.includes('how is') || 
                        preview.includes('progress') || 
                        preview.includes('doing')
                    ) {
                        reply = `Hi ${firstName},\n\nThank you for checking in. I am pleased to share that your child has been making meaningful progress. They have been improving in their recent work and are showing stronger understanding of the concepts we are covering.\n\nI would be happy to walk you through specific examples and our next steps. Would you be available for a brief call this week.\n\nBest regards,\nAlnoor`;
                    } else if (
                        tags.includes('student work') || 
                        subject.includes('essay') || 
                        subject.includes('homework') || 
                        subject.includes('assignment')
                    ) {
                        reply = `Hi ${firstName},\n\nThank you for sharing this work with me. I appreciate the effort that went into it.\n\nI will review it in more detail and provide feedback during our next session. If you have any specific questions in the meantime, please let me know.\n\nBest regards,\nAlnoor`;
                    } else if (
                        tags.includes('assessment') || 
                        subject.includes('assessment') || 
                        subject.includes('schedule') || 
                        subject.includes('appointment')
                    ) {
                        reply = `Hi ${firstName},\n\nThank you for reaching out about the assessment. Everything is set on my end and I am looking forward to seeing your child.\n\nThe assessment will be held at our centre at 2040 Yonge Street Unit 205. If anything changes or you have questions before then, please call the centre at (416) 546-5051.\n\nBest regards,\nAlnoor`;
                    } else if (
                        subject.includes('miss') || 
                        subject.includes('absent') || 
                        subject.includes('sick') || 
                        preview.includes('not attending') || 
                        preview.includes('unable to')
                    ) {
                        reply = `Hi ${firstName},\n\nThank you for letting me know. I hope your child feels better soon.\n\nWe can arrange a make up session so they stay on track. Please let me know what days work well for you, or call the centre at (416) 546-5051 and we can book a time.\n\nWarmly,\nAlnoor`;
                    } else if (
                        tags.includes('parent contact') || 
                        tags.includes('parent communication')
                    ) {
                        reply = `Hi ${firstName},\n\nThank you for reaching out and staying engaged in your child's learning.\n\nI would be happy to go over this with you in more detail. We can schedule a brief call or you are welcome to stop by the centre so we can talk through the plan together.\n\nBest regards,\nAlnoor`;
                    } else if (
                        tags.includes('vendor outreach') || 
                        preview.includes('available to connect') || 
                        preview.includes('scheduling link')
                    ) {
                        reply = `Hi ${firstName},\n\nThank you for reaching out. I appreciate you thinking of our centre.\n\nI am focused on our current students and operations, but I am open to learning more. Please send over a brief overview of how this could support our students or centre, and I will review it.\n\nBest regards,\nAlnoor`;
                    } else if (
                        tags.includes('calendar event') || 
                        subject.includes('notification:') || 
                        subject.includes('reminder')
                    ) {
                        reply = `Hi ${firstName},\n\nThank you for the reminder. I have this noted and everything is in place on my end.\n\nLooking forward to it.\n\nBest regards,\nAlnoor`;
                    } else if (
                        email.priority === 'High' || 
                        subject.includes('urgent') || 
                        subject.includes('asap') || 
                        subject.includes('important')
                    ) {
                        reply = `Hi ${firstName},\n\nThank you for reaching out. I understand this is important and I want to make sure we address it properly.\n\nCould we schedule a quick call today or tomorrow to go through this. You can reach me at (416) 546-5051 or let me know a time that works for you.\n\nBest regards,\nAlnoor`;
                    } else {
                        reply = `Hi ${firstName},\n\nThank you for your message. I appreciate you taking the time to reach out.\n\nI will review this and follow up with more details shortly. If this is time sensitive, please feel free to call the centre at (416) 546-5051.\n\nBest regards,\nAlnoor`;
                    }
                    
                    setDraftReply(reply);
                    setEmails(prev =>
                        prev.map(e => 
                            e.id === selectedEmail ? { ...e, aiDraft: reply } : e
                        )
                    );
                    setIsGenerating(false);
                }, 1500);
            };

            const importJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        const emailData = Array.isArray(data) ? data : (data.emails || []);
                        const eventData = data.events || [];
                        const taskData = data.tasks || [];

                        const processedEmails = emailData.map((item, i) => ({
                            id: Date.now() + i,
                            sender: (item.sender || '').replace(/<.*>/, '').trim(),
                            senderEmail: (item.sender || '').match(/<(.+?)>/)?.[1] || item.sender || '',
                            subject: item.subject || '',
                            preview: item.preview || '',
                            date: item.received_at || new Date().toISOString(),
                            priority: item.tags?.includes('Action Required') ? 'High' : 'Medium',
                            tags: item.tags || [],
                            aiDraft: item.aiDraft || '',
                            followUpAt: item.followUpAt || null
                        }));
                        const processedTasks = taskData.map((t, i) => ({
                            id: t.id || `task-${Date.now()}-${i}`,
                            text: t.text || '',
                            done: !!t.done,
                            dueAt: t.dueAt || null
                        }));
                        
                        setEmails(processedEmails);
                        setEvents(eventData);
                        setTasks(processedTasks);
                        setShowImport(false);
                        alert('Imported ' + processedEmails.length + ' emails, ' + eventData.length + ' events and ' + processedTasks.length + ' tasks.');
                    } catch (err) {
                        alert('Error: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };

            const copyDraftToClipboard = async () => {
                const email = emails.find(e => e.id === selectedEmail);
                if (!email) return;
                
                const textToCopy = `To: ${email.senderEmail}\n\n${draftReply}`;
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(textToCopy);
                        setShowCopySuccess(true);
                        setTimeout(() => setShowCopySuccess(false), 2000);
                        return;
                    } catch (err) {
                        console.log('Clipboard API failed, trying fallback');
                    }
                }
                
                const textArea = document.createElement('textarea');
                textArea.value = textToCopy;
                textArea.style.position = 'fixed';
                textArea.style.top = '0';
                textArea.style.left = '0';
                textArea.style.width = '2em';
                textArea.style.height = '2em';
                textArea.style.padding = '0';
                textArea.style.border = 'none';
                textArea.style.outline = 'none';
                textArea.style.boxShadow = 'none';
                textArea.style.background = 'transparent';
                textArea.setAttribute('readonly', '');
                textArea.style.opacity = '0';
                
                document.body.appendChild(textArea);
                
                const range = document.createRange();
                range.selectNodeContents(textArea);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                textArea.setSelectionRange(0, 999999);
                
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        setShowCopySuccess(true);
                        setTimeout(() => setShowCopySuccess(false), 2000);
                    } else {
                        alert('Copy failed. Please manually copy the text above.');
                    }
                } catch (err) {
                    alert('Copy failed. Please manually copy the text above.');
                }
                
                document.body.removeChild(textArea);
            };

            const deleteEmail = (emailId) => {
                const email = emails.find(e => e.id === emailId);
                if (!email) return;

                if (!confirm('Move this email to Trash.')) return;

                setEmails(prev => prev.filter(e => e.id !== emailId));
                setTrash(prev => [email, ...prev]);

                if (selectedEmail === emailId) {
                    setSelectedEmail(null);
                    setScreen('inbox');
                }

                triggerUndo({ type: 'fromInbox', email });
            };

            const restoreFromTrash = (emailId) => {
                const email = trash.find(e => e.id === emailId);
                if (!email) return;

                setTrash(prev => prev.filter(e => e.id !== emailId));
                setEmails(prev => [email, ...prev]);
            };

            const hardDeleteFromTrash = (emailId) => {
                const email = trash.find(e => e.id === emailId);
                if (!email) return;

                if (!confirm('Permanently delete this email from Trash. This can only be undone using the Undo button immediately after.')) {
                    return;
                }

                setTrash(prev => prev.filter(e => e.id !== emailId));
                triggerUndo({ type: 'hardDelete', email });
            };

            const deleteEvent = (eventId) => {
                if (confirm('Delete this event.')) {
                    setEvents(events.filter(e => e.id !== eventId));
                }
            };

            const formatTime = (dateStr) => {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };

            const filteredEmails = emails.filter(e => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                return (e.sender || '').toLowerCase().includes(q) || 
                       (e.subject || '').toLowerCase().includes(q) ||
                       (e.preview || '').toLowerCase().includes(q);
            });

            const isActionEmail = (email) => {
                const subject = (email.subject || '').toLowerCase();
                const preview = (email.preview || '').toLowerCase();
                const tags = email.tags || [];
                return email.priority === 'High' ||
                       tags.includes('Action Required') ||
                       subject.includes('reply') ||
                       preview.includes('let me know') ||
                       preview.includes('can you') ||
                       email.followUpAt;
            };

            const today = new Date();

            let agendaEmails = emails.filter(e => {
                if (!isActionEmail(e)) return false;
                if (e.followUpAt) {
                    return isSameDay(e.followUpAt, today);
                }
                return isSameDay(e.date, today);
            });
            agendaEmails = agendaEmails
                .map(e => ({ ...e, _score: getEmailPriorityScore(e, today) }))
                .sort((a, b) => b._score - a._score);

            let agendaTasks = tasks.filter(t => {
                if (t.done) return false;
                if (t.dueAt) {
                    return isSameDay(t.dueAt, today);
                }
                return true;
            });
            agendaTasks = agendaTasks
                .map(t => ({ ...t, _score: getTaskPriorityScore(t, today) }))
                .sort((a, b) => b._score - a._score);

            const agendaEvents = events.filter(ev => {
                const when = ev.rescheduledStart || ev.start;
                return isSameDay(when, today);
            });

            // Upcoming (next 7 days) and rescheduled view
            const sevenDaysAhead = new Date(today.getTime());
            sevenDaysAhead.setDate(today.getDate() + 7);

            const isWithinNext7Days = (dateStr) => {
                if (!dateStr) return false;
                const d = new Date(dateStr);
                return d >= today && d <= sevenDaysAhead;
            };

            const upcomingTasks = tasks.filter(t => {
                if (t.done) return false;
                if (!t.dueAt) return false;
                return isWithinNext7Days(t.dueAt);
            }).sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt));

            const upcomingEmails = emails.filter(e => {
                const when = e.followUpAt || e.date;
                if (!isActionEmail(e)) return false;
                return isWithinNext7Days(when);
            }).map(e => ({ ...e, _score: getEmailPriorityScore(e, today) }))
              .sort((a, b) => b._score - a._score);

            const upcomingEvents = events.filter(ev => {
                const when = ev.rescheduledStart || ev.start;
                return isWithinNext7Days(when);
            }).sort((a, b) => new Date(a.rescheduledStart || a.start) - new Date(b.rescheduledStart || b.start));

            const rescheduledOnly = {
                tasks: tasks.filter(t => t.dueAt && !isSameDay(t.dueAt, today)),
                emails: emails.filter(e => e.followUpAt && !isSameDay(e.followUpAt, today)),
                events: events.filter(ev => ev.rescheduledStart && !isSameDay(ev.rescheduledStart, today))
            };

            const openReschedule = (type, id) => {
                let currentDate = new Date();
                if (type === 'task') {
                    const task = tasks.find(t => t.id === id);
                    if (task && task.dueAt) {
                        currentDate = new Date(task.dueAt);
                    }
                } else if (type === 'email') {
                    const email = emails.find(e => e.id === id);
                    if (email && email.followUpAt) {
                        currentDate = new Date(email.followUpAt);
                    }
                } else if (type === 'event') {
                    const ev = events.find(e => e.id === id);
                    if (ev && (ev.rescheduledStart || ev.start)) {
                        currentDate = new Date(ev.rescheduledStart || ev.start);
                    }
                }
                const dateStr = currentDate.toISOString().split('T')[0];
                const timeStr = currentDate.toTimeString().slice(0, 5);
                setRescheduleDate(dateStr);
                setRescheduleTime(timeStr);
                setRescheduleNatural('');
                setRescheduleTarget({ type, id });
            };

            const applyReschedule = () => {
                if (!rescheduleTarget) {
                    setRescheduleTarget(null);
                    return;
                }

                let iso = null;

                if (rescheduleNatural && rescheduleNatural.trim()) {
                    const parsed = parseNaturalSchedule(rescheduleNatural, new Date());
                    if (parsed && !isNaN(parsed.getTime())) {
                        iso = parsed.toISOString();
                    } else {
                        alert("I could not understand that reschedule text. Use clear phrases like 'tomorrow 2pm', 'next Friday 3pm' or set date and time below.");
                        return;
                    }
                } else if (rescheduleDate) {
                    const timePart = rescheduleTime || '09:00';
                    iso = new Date(`${rescheduleDate}T${timePart}:00`).toISOString();
                } else {
                    setRescheduleTarget(null);
                    return;
                }

                if (rescheduleTarget.type === 'task') {
                    setTasks(prev => prev.map(t => 
                        t.id === rescheduleTarget.id ? { ...t, dueAt: iso } : t
                    ));
                } else if (rescheduleTarget.type === 'email') {
                    setEmails(prev => prev.map(e => 
                        e.id === rescheduleTarget.id ? { ...e, followUpAt: iso } : e
                    ));
                } else if (rescheduleTarget.type === 'event') {
                    setEvents(prev => prev.map(ev => 
                        ev.id === rescheduleTarget.id ? { ...ev, rescheduledStart: iso } : ev
                    ));
                }
                setRescheduleTarget(null);
            };

                    setPinInput("");

                    setPinInput("");

                const y = d.getFullYear();

                                            {rescheduledOnly.events.map(ev => (
                                                <li key={ev.id}>
                                                    {ev.title} → {ev.rescheduledStart ? `${formatDate(ev.rescheduledStart)} ${formatTime(ev.rescheduledStart)}` : 'No override date'}
                                                </li>
                                            ))}
                                        </ul>
                                    ) : (
                                        <p className="text-xs text-gray-500">No rescheduled events.</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* WEEKLY REVIEW SCREEN */}
                    {screen === 'weekly' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h1 className="text-2xl font-bold">Weekly review</h1>
                                        <p className="text-sm text-gray-500 mt-1">{weeklySectionTitle()}</p>
                                    </div>
                                    <button
                                        onClick={() => setScreen('today')}
                                        className="text-blue-500 text-sm"
                                    >
                                        Done
                                    </button>
                                </div>
                            </div>
                            <div className="p-4 space-y-4 text-sm">
                                <div className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/80' : 'bg-white'}`}>
                                    <h2 className="font-semibold mb-2">Wins</h2>
                                    <p className="text-xs text-gray-500 mb-2">What moved retention, parent satisfaction or student progress.</p>
                                    <textarea
                                        value={weeklyNotes}
                                        onChange={(e) => setWeeklyNotes(e.target.value)}
                                        placeholder="Summarize wins, hard lessons, bottlenecks, automations to improve."
                                        className={`w-full min-h-[200px] p-3 rounded-xl border text-sm ${darkMode ? 'bg-gray-900 border-gray-700' : 'bg-gray-50 border-gray-300'}`}
                                    />
                                </div>
                                <div className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/80' : 'bg-white'}`}>
                                    <h2 className="font-semibold mb-2">Data snapshot</h2>
                                    <div className="grid grid-cols-2 gap-3 text-xs">
                                        <div>
                                            <p className="text-gray-500">Emails handled</p>
                                            <p className="text-lg font-semibold">{emails.length}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500">Events this week</p>
                                            <p className="text-lg font-semibold">{upcomingEvents.length}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500">Open tasks</p>
                                            <p className="text-lg font-semibold">{tasks.filter(t => !t.done).length}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500">Completed tasks</p>
                                            <p className="text-lg font-semibold">{tasks.filter(t => t.done).length}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* INBOX SCREEN */}
                    {screen === 'inbox' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <div className="flex justify-between items-center mb-4">
                                    <h1 className="text-2xl font-bold">Inbox</h1>
                                    <button onClick={() => setShowImport(true)} className="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium">
                                        Upload
                                    </button>
                                </div>
                                
                                <div className={`flex items-center gap-2 px-4 py-3 rounded-xl ${darkMode ? 'bg-gray-800' : 'bg-gray-100'}`}>
                                    <span className="text-xl">🔍</span>
                                    <input 
                                        type="text" 
                                        placeholder="Search emails..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="flex-1 bg-transparent outline-none text-sm"
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="text-gray-500">✕</button>
                                    )}
                                </div>
                            </div>

                            <div className="p-4 space-y-3">
                                {filteredEmails.map(email => (
                                    <div
                                        key={email.id}
                                        className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white/50 border-gray-200'}`}
                                        onTouchStart={(e) => {
                                            if (e.touches && e.touches.length > 0) {
                                                touchStartXRef.current = e.touches[0].clientX;
                                            }
                                        }}
                                        onTouchEnd={(e) => {
                                            if (e.changedTouches && e.changedTouches.length > 0 && touchStartXRef.current !== null) {
                                                const endX = e.changedTouches[0].clientX;
                                                const diff = touchStartXRef.current - endX;
                                                if (diff > 50) {
                                                    deleteEmail(email.id);
                                                }
                                            }
                                            touchStartXRef.current = null;
                                        }}
                                    >
                                        <div className="flex items-start justify-between mb-2">
                                            <h3 
                                                className="font-semibold text-sm flex-1 cursor-pointer"
                                                onClick={() => { 
                                                    setSelectedEmail(email.id); 
                                                    setDraftReply(email.aiDraft || 'Click "Generate smart reply" to create a personalized response.');
                                                    setScreen('draft'); 
                                                }}
                                            >
                                                {email.sender}
                                            </h3>
                                            <div className="flex items-center gap-2">
                                                <span className={`text-xs px-2 py-0.5 rounded-full ${email.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                    {email.priority}
                                                </span>
                                                <span className="text-xs text-gray-500">{formatDate(email.date)}</span>
                                                <button
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        deleteEmail(email.id);
                                                    }}
                                                    className="text-red-500 hover:bg-red-100 p-1 rounded-lg"
                                                    title="Delete email"
                                                >
                                                    🗑️
                                                </button>
                                            </div>
                                        </div>
                                        <p 
                                            className="font-medium text-sm mb-1 cursor-pointer"
                                            onClick={() => { 
                                                setSelectedEmail(email.id); 
                                                setDraftReply(email.aiDraft || 'Click "Generate smart reply" to create a personalized response.');
                                                setScreen('draft'); 
                                            }}
                                        >
                                            {email.subject}
                                        </p>
                                        <p 
                                            className="text-xs text-gray-500 mt-1 cursor-pointer"
                                            onClick={() => { 
                                                setSelectedEmail(email.id); 
                                                setDraftReply(email.aiDraft || 'Click "Generate smart reply" to create a personalized response.');
                                                setScreen('draft'); 
                                            }}
                                        >
                                            {email.preview.substring(0, 80)}...
                                        </p>
                                    </div>
                                ))}
                                {filteredEmails.length === 0 && (
                                    <div className="text-center py-12 text-gray-500">
                                        {searchQuery ? 'No emails found' : 'No emails yet'}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* DRAFT SCREEN */}
                    {screen === 'draft' && selectedEmail && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-4 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <button onClick={() => setScreen('inbox')} className="flex items-center gap-2 text-blue-500">
                                    ← Back to Inbox
                                </button>
                            </div>
                            <div className="p-4 space-y-4">
                                {(() => {
                                    const email = emails.find(e => e.id === selectedEmail);
                                    if (!email) return null;

                                    return (
                                        <>
                                            {/* Email Preview Card */}
                                            <div className={`rounded-2xl p-5 border ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}>
                                                <div className="flex items-start justify-between mb-3">
                                                    <div className="flex-1">
                                                        <p className="text-sm text-gray-500 mb-1">From:</p>
                                                        <p className="font-semibold text-lg">{email.sender}</p>
                                                        <p className="text-sm text-gray-600">{email.senderEmail}</p>
                                                    </div>
                                                    <span className={`text-xs px-2 py-1 rounded-full ${email.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                        {email.priority}
                                                    </span>
                                                </div>
                                                <div className="border-t pt-3 mt-3">
                                                    <p className="text-sm text-gray-500 mb-1">Subject:</p>
                                                    <p className="font-semibold mb-3">{email.subject}</p>
                                                    <p className="text-sm text-gray-500 mb-1">Message:</p>
                                                    <p className="text-sm leading-relaxed">{email.preview}</p>
                                                </div>
                                                {email.tags && email.tags.length > 0 && (
                                                    <div className="flex gap-2 mt-3 flex-wrap">
                                                        {email.tags.map((tag, idx) => (
                                                            <span key={idx} className={`text-xs px-2 py-1 rounded-full ${darkMode ? 'bg-gray-700' : 'bg-gray-100'}`}>
                                                                {tag}
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* AI Reply Card */}
                                            <div className={`rounded-2xl p-5 border ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}>
                                                <h2 className="text-xl font-bold mb-4">AI powered reply</h2>
                                                
                                                <button 
                                                    onClick={generateAIReply}
                                                    disabled={isGenerating}
                                                    className={`w-full mb-4 py-3 rounded-xl font-semibold ${
                                                        isGenerating 
                                                            ? 'bg-gray-400 cursor-not-allowed' 
                                                            : 'bg-gradient-to-r from-purple-500 to-blue-500 hover:from-purple-600 hover:to-blue-600 text-white'
                                                    }`}>
                                                    {isGenerating ? 'Generating smart reply' : 'Generate smart reply'}
                                                </button>
                                                
                                                <textarea 
                                                    value={draftReply}
                                                    onChange={(e) => setDraftReply(e.target.value)}
                                                    placeholder="Click 'Generate smart reply' to create a personalized response."
                                                    className="w-full p-4 rounded-xl border min-h-64 bg-gray-50 text-sm"
                                                />
                                                <div className="flex gap-3 mt-4">
                                                    <button 
                                                        onClick={copyDraftToClipboard}
                                                        className="flex-1 bg-blue-500 text-white px-6 py-3 rounded-xl font-semibold">
                                                        Copy email and reply
                                                    </button>
                                                    <button 
                                                        onClick={() => setScreen('inbox')}
                                                        className={`px-6 py-3 rounded-xl font-semibold ${darkMode ? 'bg-gray-700' : 'bg-gray-200'}`}>
                                                        Done
                                                    </button>
                                                </div>
                                            </div>
                                        </>
                                    );
                                })()}
                            </div>
                        </div>
                    )}

                    {/* TASKS SCREEN */}
                    {screen === 'tasks' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <h1 className="text-2xl font-bold">Tasks</h1>
                            </div>
                            <div className="p-4 space-y-3">
                                {tasks.map(task => (
                                    <div key={task.id} className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}>
                                        <div className="flex items-center justify-between gap-3">
                                            <div className="flex items-center gap-3">
                                                <input 
                                                    type="checkbox" 
                                                    checked={task.done} 
                                                    onChange={() => {
                                                        setTasks(prev => prev.map(t => t.id === task.id ? { ...t, done: !t.done } : t));
                                                    }} 
                                                    className="w-6 h-6" 
                                                />
                                                <span className={task.done ? 'line-through text-gray-400' : ''}>{task.text}</span>
                                            </div>
                                            <button
                                                onClick={() => openReschedule('task', task.id)}
                                                className="text-xs px-2 py-1 rounded-lg bg-blue-100 text-blue-700"
                                            >
                                                Reschedule
                                            </button>
                                        </div>
                                        {task.dueAt && (
                                            <p className="text-xs text-gray-500 mt-1">
                                                Scheduled for {formatDate(task.dueAt)} at {formatTime(task.dueAt)}
                                            </p>
                                        )}
                                    </div>
                                ))}
                                {tasks.length === 0 && (
                                    <p className="text-center text-gray-500 text-sm">No tasks added yet.</p>
                                )}
                            </div>
                        </div>
                    )}

                    {/* CALENDAR SCREEN */}
                    {screen === 'calendar' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <h1 className="text-2xl font-bold">Calendar</h1>
                                <p className="text-sm text-gray-500 mt-1">{events.length} events</p>
                            </div>
                            <div className="p-4 space-y-3">
                                {events.length > 0 ? events.map((event, idx) => {
                                    const when = event.rescheduledStart || event.start;
                                    const eventDate = new Date(when);
                                    const prevEvent = events[idx - 1];
                                    const prevWhen = prevEvent ? (prevEvent.rescheduledStart || prevEvent.start) : null;
                                    const showDate = idx === 0 || new Date(prevWhen).toDateString() !== eventDate.toDateString();
                                    
                                    return (
                                        <div key={event.id}>
                                            {showDate && (
                                                <div className="text-sm font-bold text-gray-500 mt-4 mb-2">
                                                    {eventDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}
                                                </div>
                                            )}
                                            <div className={`rounded-2xl p-5 border relative ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}>
                                                <div className="flex justify-between items-start">
                                                    <div className="flex-1">
                                                        <h3 className="text-lg font-bold">{event.title}</h3>
                                                        <p className="text-sm text-gray-500 mt-2">Time {formatTime(when)}</p>
                                                        {event.location && <p className="text-sm text-gray-500 mt-1">Location {event.location}</p>}
                                                    </div>
                                                    <div className="flex flex-col items-end gap-2">
                                                        <button 
                                                            onClick={() => openReschedule('event', event.id)}
                                                            className="text-xs px-2 py-1 rounded-lg bg-blue-100 text-blue-700"
                                                        >
                                                            Reschedule
                                                        </button>
                                                        <button 
                                                            onClick={() => deleteEvent(event.id)}
                                                            className="text-red-500 hover:bg-red-50 p-2 rounded-lg ml-2">
                                                            🗑️
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                }) : (
                                    <div className="text-center py-12 text-gray-500">
                                        <p>No events.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* TRASH SCREEN */}
                    {screen === 'trash' && (
                        <div className="pb-24">
                            <div className={`sticky top-0 backdrop-blur-xl border-b p-6 ${darkMode ? 'bg-gray-900/80' : 'bg-white/80'}`}>
                                <h1 className="text-2xl font-bold">Trash</h1>
                                <p className="text-sm text-gray-500 mt-1">{trash.length} deleted emails</p>
                            </div>
                            <div className="p-4 space-y-3">
                                {trash.map(email => (
                                    <div
                                        key={email.id}
                                        className={`rounded-2xl p-4 border ${darkMode ? 'bg-gray-800/50 border-gray-700' : 'bg-white/50 border-gray-200'}`}
                                    >
                                        <div className="flex items-start justify-between mb-2">
                                            <div className="flex-1">
                                                <p className="font-semibold text-sm">{email.sender}</p>
                                                <p className="text-xs text-gray-500">{email.senderEmail}</p>
                                                <p className="font-medium text-sm mt-2">{email.subject}</p>
                                                <p className="text-xs text-gray-500 mt-1">
                                                    {email.preview.substring(0, 80)}...
                                                </p>
                                            </div>
                                            <div className="flex flex-col items-end gap-2">
                                                <span className={`text-xs px-2 py-0.5 rounded-full ${email.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}`}>
                                                    {email.priority}
                                                </span>
                                                <span className="text-xs text-gray-500">{formatDate(email.date)}</span>
                                            </div>
                                        </div>
                                        <div className="flex gap-3 mt-3">
                                            <button
                                                onClick={() => restoreFromTrash(email.id)}
                                                className="flex-1 bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold"
                                            >
                                                Restore
                                            </button>
                                            <button
                                                onClick={() => hardDeleteFromTrash(email.id)}
                                                className="flex-1 bg-red-500 text-white px-4 py-2 rounded-xl text-sm font-semibold"
                                            >
                                                Delete permanently
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                {trash.length === 0 && (
                                    <div className="text-center py-12 text-gray-500">
                                        No emails in Trash.
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Bottom navigation */}
                    <div className={`fixed bottom-0 left-0 right-0 border-t backdrop-blur-xl ${darkMode ? 'bg-gray-900/95 border-gray-800' : 'bg-white/95 border-gray-200'}`}>
                        <div className="flex justify-around p-4">
                            <button onClick={() => setScreen('today')} className={`flex flex-col items-center ${screen === 'today' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">📓</span>
                                <span className="text-xs mt-1">Briefing</span>
                            </button>
                            <button onClick={() => setScreen('inbox')} className={`flex flex-col items-center ${(screen === 'inbox' || screen === 'draft') ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">📧</span>
                                <span className="text-xs mt-1">Inbox</span>
                            </button>
                            <button onClick={() => setScreen('tasks')} className={`flex flex-col items-center ${screen === 'tasks' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">✅</span>
                                <span className="text-xs mt-1">Tasks</span>
                            </button>
                            <button onClick={() => setScreen('calendar')} className={`flex flex-col items-center ${screen === 'calendar' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">📅</span>
                                <span className="text-xs mt-1">Calendar</span>
                            </button>
                            <button onClick={() => setScreen('upcoming')} className={`flex flex-col items-center ${screen === 'upcoming' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">⏭️</span>
                                <span className="text-xs mt-1">Upcoming</span>
                            </button>
                            <button onClick={() => setScreen('trash')} className={`flex flex-col items-center ${screen === 'trash' ? 'text-blue-500' : 'text-gray-400'}`}>
                                <span className="text-2xl">🗑️</span>
                                <span className="text-xs mt-1">Trash</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
