<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Day Organizer">
    <title>AI Day Organizer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black">
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
    const { useState, useEffect } = React;

    const PLACEHOLDER_REPLY = 'Click "Generate Smart Reply" to create a personalized response...';

    function App() {
        const [emails, setEmails] = useState([]);
        const [tasks, setTasks] = useState([]);
        const [events, setEvents] = useState([]);
        const [screen, setScreen] = useState('agenda'); // default: Daily Agenda
        const [darkMode, setDarkMode] = useState(false);
        const [selectedEmail, setSelectedEmail] = useState(null);
        const [showImport, setShowImport] = useState(false);
        const [searchQuery, setSearchQuery] = useState('');
        const [draftReply, setDraftReply] = useState('');
        const [showCopySuccess, setShowCopySuccess] = useState(false);
        const [isGenerating, setIsGenerating] = useState(false);
        const [summary, setSummary] = useState(null);
        const [hasSmartReply, setHasSmartReply] = useState(false);

        // New: action sheet for Agenda emails
        const [activeAgendaEmail, setActiveAgendaEmail] = useState(null);
        const [showEmailActionSheet, setShowEmailActionSheet] = useState(false);

        // New: modal for events
        const [activeEvent, setActiveEvent] = useState(null);

        // Helper: today key (yyyy-mm-dd)
        const getTodayKey = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const todayKey = getTodayKey();

        // Load from localStorage
        useEffect(() => {
            const savedEmails = localStorage.getItem('dayorganizer-emails');
            const savedTasks = localStorage.getItem('dayorganizer-tasks');
            const savedEvents = localStorage.getItem('dayorganizer-events');

            if (savedEmails) {
                try {
                    setEmails(JSON.parse(savedEmails));
                } catch (e) {
                    console.error('Failed to parse saved emails', e);
                }
            }
            if (savedTasks) {
                try {
                    const parsed = JSON.parse(savedTasks);
                    const normalized = parsed.map(t => ({
                        ...t,
                        dueDate: t.dueDate || todayKey
                    }));
                    setTasks(normalized);
                } catch (e) {
                    console.error('Failed to parse saved tasks', e);
                }
            }
            if (savedEvents) {
                try {
                    setEvents(JSON.parse(savedEvents));
                } catch (e) {
                    console.error('Failed to parse saved events', e);
                }
            }
        }, []);

        // Persist emails
        useEffect(() => {
            localStorage.setItem('dayorganizer-emails', JSON.stringify(emails));
        }, [emails]);

        // Persist tasks
        useEffect(() => {
            localStorage.setItem('dayorganizer-tasks', JSON.stringify(tasks));
        }, [tasks]);

        // Persist events
        useEffect(() => {
            localStorage.setItem('dayorganizer-events', JSON.stringify(events));
        }, [events]);

        // Rule-based "smart reply" generator (no API)
        const generateAIReply = (emailIdOverride) => {
            const targetId = emailIdOverride ?? selectedEmail;
            const email = emails.find(e => e.id === targetId);
            if (!email) return;

            setIsGenerating(true);

            setTimeout(() => {
                const firstName = (email.sender || '').split(' ')[0] || 'there';
                const subject = (email.subject || '').toLowerCase();
                const preview = (email.preview || '').toLowerCase();
                const tags = Array.isArray(email.tags)
                    ? email.tags.map(t => String(t).toLowerCase())
                    : [];

                let reply = '';

                if (
                    subject.includes('progress') ||
                    subject.includes('how is') ||
                    preview.includes('progress') ||
                    preview.includes('doing')
                ) {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for checking in. I am pleased to share that your child has been making solid progress, ` +
                        `and we are continuing to build consistency and confidence in their work.\n\n` +
                        `I would be happy to walk you through recent results and next steps. ` +
                        `If you would like, we can schedule a brief call this week to review in more detail.\n\n` +
                        `Best regards,\nAlnoor`;
                } else if (
                    tags.includes('student work') ||
                    subject.includes('essay') ||
                    subject.includes('homework') ||
                    subject.includes('assignment')
                ) {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for sending this through. I have reviewed the work and appreciate the effort that went into it.\n\n` +
                        `I will give more detailed feedback in our upcoming session, and we will use it to guide the next set of worksheets and goals.\n\n` +
                        `Best regards,\nAlnoor`;
                } else if (
                    tags.includes('assessment') ||
                    subject.includes('assessment') ||
                    subject.includes('schedule') ||
                    subject.includes('appointment')
                ) {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for your message regarding the assessment and schedule. ` +
                        `We are set up at Kumon of Davisville (2040 Yonge Street, Unit 205) and ready for the scheduled time.\n\n` +
                        `If anything changes or you would like to adjust the timing, please let me know or call the center at (416) 546-5051.\n\n` +
                        `Best regards,\nAlnoor`;
                } else if (
                    subject.includes('miss') ||
                    subject.includes('absent') ||
                    subject.includes('sick') ||
                    preview.includes('not attending') ||
                    preview.includes('unable to')
                ) {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for letting me know. I hope your child is feeling better soon.\n\n` +
                        `We can absolutely arrange a make up plan so they stay on track. ` +
                        `Please let me know a couple of days and times that work, or feel free to call the center at (416) 546-5051 and we will coordinate.\n\n` +
                        `Warmly,\nAlnoor`;
                } else if (tags.includes('parent contact') || tags.includes('parent communication')) {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for reaching out and for staying engaged in your child’s learning. I really value that partnership.\n\n` +
                        `I would be happy to talk through your questions in more detail. ` +
                        `If you would like, we can schedule a quick call this week, or you can share a couple of times that work for you.\n\n` +
                        `Best regards,\nAlnoor`;
                } else if (
                    tags.includes('vendor') ||
                    tags.includes('vendor outreach') ||
                    preview.includes('available to connect') ||
                    preview.includes('scheduling link')
                ) {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for reaching out and sharing this. I am currently focused on our students and center operations, ` +
                        `but I am open to learning more if it directly supports student outcomes or center efficiency.\n\n` +
                        `If you could send over a brief summary of how this might help Kumon of Davisville, I will review it and follow up if it is a fit.\n\n` +
                        `Best regards,\nAlnoor`;
                } else if (
                    tags.includes('calendar event') ||
                    subject.includes('notification:') ||
                    subject.includes('reminder')
                ) {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for the reminder. This is noted on my end and I am set for the scheduled time.\n\n` +
                        `Looking forward to it.\n\n` +
                        `Best regards,\nAlnoor`;
                } else if (
                    email.priority === 'High' ||
                    subject.includes('urgent') ||
                    subject.includes('asap') ||
                    subject.includes('important')
                ) {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for reaching out. I understand this is important and I want to address it promptly.\n\n` +
                        `Could we schedule a quick call today or tomorrow to go through this properly. ` +
                        `Please feel free to call me directly at (416) 546-5051 or let me know a time that works for you.\n\n` +
                        `Best regards,\nAlnoor`;
                } else {
                    reply =
                        `Hi ${firstName},\n\n` +
                        `Thank you for your message. I appreciate you taking the time to reach out.\n\n` +
                        `I will review this and follow up with more details shortly. ` +
                        `If this is time sensitive, please feel free to call the centre at (416) 546-5051.\n\n` +
                        `Best regards,\nAlnoor`;
                }

                setDraftReply(reply);
                setHasSmartReply(true);

                setEmails(emails.map(e =>
                    e.id === targetId ? { ...e, aiDraft: reply } : e
                ));
                setIsGenerating(false);
            }, 1000);
        };

        // Tone adjustment for draft replies
        const adjustTone = (mode) => {
    let text = draftReply;
    if (!text || !text.trim()) return;

    // Normalize signature
    text = text.replace(/Warmly,\s*Alnoor/gi, 'Best regards,\nAlnoor');

    if (mode === 'friendly') {
        text = text.replace(/\bHi\b/gi, 'Hi');
        text = text.replace(/Best regards,\s*Alnoor/gi, 'Warmly,\nAlnoor');
        if (!text.includes('I appreciate')) {
            text = text.replace(/\n\nI (?:will|would) review/, '\n\nI appreciate you reaching out. I will review');
        }
    }

    if (mode === 'direct') {
        text = text.replace(/\bI would be happy to\b/gi, 'I will');
        text = text.replace(/\bI would be glad to\b/gi, 'I will');
        text = text.replace(/\bif you would like\b/gi, '');
        text = text.replace(
            /\bI will review this and follow up with more details shortly\./gi,
            'I will review this and get back to you with a clear next step.'
        );
    }

    if (mode === 'formal') {
        text = text.replace(/\bHi\b/gi, 'Hello');
        text = text.replace(/Warmly,\s*Alnoor/gi, 'Best regards,\nAlnoor');
        text = text.replace(/\bThanks\b/gi, 'Thank you');
    }

    setDraftReply(text);
};

        const importJSON = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    const emailData = Array.isArray(data) ? data : (data.emails || []);
                    const eventData = data.events || [];

                    const processed = emailData.map((item, i) => ({
                        id: item.id || (Date.now() + i),
                        sender: (item.sender || '').replace(/<.*>/, '').trim(),
                        senderEmail: (item.sender && item.sender.match(/<(.+?)>/))
                            ? item.sender.match(/<(.+?)>/)[1]
                            : (item.senderEmail || item.sender || ''),
                        subject: item.subject || '(No subject)',
                        preview: item.preview || '',
                        date: item.received_at || item.date || new Date().toISOString(),
                        priority: item.priority || (item.tags && item.tags.includes('Action Required') ? 'High' : 'Medium'),
                        tags: item.tags || [],
                        aiDraft: item.aiDraft || '',
                        action_required: item.action_required || false,
                        priority_score: typeof item.priority_score === 'number' ? item.priority_score : null,
                        category: item.category || null,
                        completed: item.completed || false,
                        snoozedForToday: item.snoozedForToday || false
                    }));

                    const processedEvents = eventData.map(ev => ({
                        id: ev.id || ev.title + (ev.start || ''),
                        title: ev.title || '(No title)',
                        start: ev.start,
                        end: ev.end,
                        location: ev.location || '',
                        is_today: ev.is_today || false,
                        is_within_3_days: ev.is_within_3_days || false,
                        doneToday: ev.doneToday || false
                    }));

                    setEmails(processed);
                    setEvents(processedEvents);
                    if (data.summary) {
                        setSummary(data.summary);
                    } else {
                        setSummary(null);
                    }

                    setShowImport(false);
                    alert('✅ Imported ' + processed.length + ' emails and ' + processedEvents.length + ' events!');
                } catch (err) {
                    console.error(err);
                    alert('❌ Error: ' + err.message);
                }
            };
            reader.readAsText(file);
        };

        const copyDraftToClipboard = async () => {
            const textToCopy = (draftReply || '').trim();
            if (!textToCopy) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    setShowCopySuccess(true);
                    setTimeout(() => setShowCopySuccess(false), 2000);
                    return;
                } catch (err) {
                    console.log('Clipboard API failed, trying fallback');
                }
            }

            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            textArea.style.position = 'fixed';
            textArea.style.top = '0';
            textArea.style.left = '0';
            textArea.style.width = '2em';
            textArea.style.height = '2em';
            textArea.style.padding = '0';
            textArea.style.border = 'none';
            textArea.style.outline = 'none';
            textArea.style.boxShadow = 'none';
            textArea.style.background = 'transparent';
            textArea.setAttribute('readonly', '');
            textArea.style.opacity = '0';

            document.body.appendChild(textArea);

            const range = document.createRange();
            range.selectNodeContents(textArea);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            textArea.setSelectionRange(0, 999999);

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    setShowCopySuccess(true);
                    setTimeout(() => setShowCopySuccess(false), 2000);
                } else {
                    alert('Copy failed. Please manually copy the text above.');
                }
            } catch (err) {
                alert('Copy failed. Please manually copy the text above.');
            }

            document.body.removeChild(textArea);
        };

        const deleteEmail = (emailId) => {
            if (confirm('Delete this email.')) {
                setEmails(emails.filter(e => e.id !== emailId));
                if (selectedEmail === emailId) {
                    setSelectedEmail(null);
                    setScreen('inbox');
                }
            }
        };

        const deleteEvent = (eventId) => {
            if (confirm('Delete this event.')) {
                setEvents(events.filter(e => e.id !== eventId));
            }
        };

        // Email agenda helpers
        const markEmailCompleted = (emailId) => {
            setEmails(emails.map(e =>
                e.id === emailId ? { ...e, completed: true } : e
            ));
        };

        const snoozeEmailForToday = (emailId) => {
            setEmails(emails.map(e =>
                e.id === emailId ? { ...e, snoozedForToday: true } : e
            ));
        };

        // Task helpers
        const addTask = (text, dueDate) => {
            if (!text.trim()) return;
            const date = dueDate || todayKey;
            const newTask = {
                id: Date.now(),
                text: text.trim(),
                done: false,
                dueDate: date
            };
            setTasks([...tasks, newTask]);
        };

        const toggleTaskDone = (taskId) => {
            setTasks(tasks.map(t =>
                t.id === taskId ? { ...t, done: !t.done } : t
            ));
        };

        const rescheduleTask = (taskId, mode) => {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            let baseDate = task.dueDate ? new Date(task.dueDate) : new Date();
            if (isNaN(baseDate.getTime())) {
                baseDate = new Date();
            }

            const addDays = (d, n) => {
                const c = new Date(d.getTime());
                c.setDate(c.getDate() + n);
                return c;
            };

            let newDateObj = new Date(baseDate);

            if (mode === 'tomorrow') {
                newDateObj = addDays(newDateObj, 1);
            } else if (mode === 'weekend') {
                const day = newDateObj.getDay();
                const diffToSaturday = (6 - day + 7) % 7 || 7;
                newDateObj = addDays(newDateObj, diffToSaturday);
            } else if (mode === 'nextWeek') {
                newDateObj = addDays(newDateObj, 7);
            } else if (mode === 'pick') {
                const current = task.dueDate || todayKey;
                const input = prompt('Enter new due date (YYYY-MM-DD)', current);
                if (!input) return;
                const valid = /^\d{4}-\d{2}-\d{2}$/.test(input);
                if (!valid) {
                    alert('Invalid date format. Use YYYY-MM-DD.');
                    return;
                }
                const testDate = new Date(input);
                if (isNaN(testDate.getTime())) {
                    alert('Invalid date.');
                    return;
                }
                newDateObj = testDate;
            }

            const year = newDateObj.getFullYear();
            const month = String(newDateObj.getMonth() + 1).padStart(2, '0');
            const day = String(newDateObj.getDate()).padStart(2, '0');
            const newKey = `${year}-${month}-${day}`;

            setTasks(tasks.map(t =>
                t.id === taskId ? { ...t, dueDate: newKey } : t
            ));
        };

        // Event helpers for modal
        const markEventDoneToday = (eventId) => {
            setEvents(events.map(ev =>
                ev.id === eventId ? { ...ev, doneToday: true } : ev
            ));
            setActiveEvent(null);
        };

        const rescheduleEvent = (eventId) => {
    const ev = events.find(e => e.id === eventId);
    if (!ev) return;

    // Create container for the picker
    const picker = document.createElement('input');
    picker.type = 'datetime-local';
    picker.value = ev.start ? ev.start.slice(0, 16) : '';
    picker.style.position = 'fixed';
    picker.style.left = '-9999px';
    document.body.appendChild(picker);

    // Simulate a click to bring up iOS date/time picker
    picker.click();

    picker.addEventListener('change', () => {
        const newVal = picker.value;
        document.body.removeChild(picker);

        if (!newVal) return;

        const d = new Date(newVal);
        if (isNaN(d.getTime())) {
            alert('Invalid date.');
            return;
        }

        const iso = d.toISOString();

        setEvents(events.map(e =>
            e.id === eventId ? { ...e, start: iso } : e
        ));
        setActiveEvent(null);
    });
};

        const formatTime = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        };

        const formatDateHuman = (yyyyMMdd) => {
            if (!yyyyMMdd) return '';
            const [y, m, d] = yyyyMMdd.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            if (isNaN(dt.getTime())) return yyyyMMdd;
            return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        };

        const filteredEmails = emails.filter(e => {
            if (!searchQuery) return true;
            const q = searchQuery.toLowerCase();
            return (e.sender || '').toLowerCase().includes(q) ||
                (e.subject || '').toLowerCase().includes(q) ||
                (e.preview || '').toLowerCase().includes(q);
        });

        const isActionEmail = (email) => {
            if (email.completed) return false;
            if (email.snoozedForToday) return false;

            const tags = Array.isArray(email.tags) ? email.tags : [];
            const hasActionTag = tags.includes('Action Required') || tags.includes('high priority');
            const hasFlag = email.action_required === true;
            const scoreHigh = typeof email.priority_score === 'number' && email.priority_score >= 50;
            const subject = (email.subject || '').toLowerCase();
            const preview = (email.preview || '').toLowerCase();
            const question = subject.endsWith('?') || preview.endsWith('?');
            return hasActionTag || hasFlag || scoreHigh || question;
        };

        const agendaEmails = emails
            .filter(isActionEmail)
            .sort((a, b) => {
                const sa = typeof a.priority_score === 'number' ? a.priority_score : 0;
                const sb = typeof b.priority_score === 'number' ? b.priority_score : 0;
                return sb - sa;
            });

        const agendaEventsToday = events
            .filter(ev => {
                if (ev.doneToday) return false;
                if (ev.is_today) return true;
                if (ev.start && ev.start.slice(0, 10) === todayKey) return true;
                return false;
            })
            .sort((a, b) => {
                const as = a.start || '';
                const bs = b.start || '';
                return as.localeCompare(bs);
            });

        const tasksToday = tasks.filter(t => !t.done && t.dueDate === todayKey);
        const tasksOverdue = tasks.filter(t => !t.done && t.dueDate && t.dueDate < todayKey);

        const [newTaskText, setNewTaskText] = useState('');
        const [newTaskDue, setNewTaskDue] = useState(todayKey);

        const rootClass = darkMode
            ? 'bg-gray-900 text-white min-h-screen'
            : 'bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen';

        const showToneControls =
            hasSmartReply ||
            (draftReply && draftReply.trim() && draftReply !== PLACEHOLDER_REPLY);

        return (
            <div className={rootClass}>
                {showImport && (
                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                        <div
                            className={`rounded-3xl p-6 max-w-md w-full ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                            <div className="flex justify-between mb-4">
                                <h2 className="text-xl font-bold">Import JSON</h2>
                                <button onClick={() => setShowImport(false)} className="text-2xl">&times;</button>
                            </div>
                            <p className="text-sm text-gray-500 mb-4">Upload your Day Organizer JSON file</p>
                            <input
                                type="file"
                                accept=".json"
                                onChange={importJSON}
                                className="w-full p-3 rounded-xl border"
                            />
                        </div>
                    </div>
                )}

                {showCopySuccess && (
                    <div
                        className="fixed top-20 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-xl shadow-lg z-50">
                        ✅ Copied to clipboard!
                    </div>
                )}

                {/* Email action sheet for Agenda */}
                {activeAgendaEmail && showEmailActionSheet && (
                    <div className="fixed inset-0 bg-black/40 flex items-end justify-center z-50">
                        <div className={`w-full max-w-md rounded-t-3xl p-4 ${darkMode ? 'bg-gray-900' : 'bg-white'}`}>
                            <div className="mb-3">
                                <p className="text-xs text-gray-500">Email</p>
                                <p className="text-sm font-semibold">{activeAgendaEmail.subject}</p>
                                <p className="text-xs text-gray-500 mt-1">{activeAgendaEmail.sender}</p>
                            </div>
                            <div className="space-y-2">
                                <button
                                    className="w-full py-2 rounded-xl text-sm font-medium bg-gray-100"
                                    onClick={() => {
                                        const email = activeAgendaEmail;
                                        setSelectedEmail(email.id);
                                        if (email.aiDraft) {
                                            setDraftReply(email.aiDraft);
                                            setHasSmartReply(true);
                                        } else {
                                            setDraftReply(PLACEHOLDER_REPLY);
                                            setHasSmartReply(false);
                                        }
                                        setShowEmailActionSheet(false);
                                        setActiveAgendaEmail(null);
                                        setScreen('draft');
                                    }}
                                >
                                    Open email
                                </button>
                                <button
                                    className="w-full py-2 rounded-xl text-sm font-medium bg-blue-500 text-white"
                                    onClick={() => {
                                        const email = activeAgendaEmail;
                                        setSelectedEmail(email.id);
                                        setDraftReply(PLACEHOLDER_REPLY);
                                        setHasSmartReply(false);
                                        setShowEmailActionSheet(false);
                                        setActiveAgendaEmail(null);
                                        setScreen('draft');
                                        setTimeout(() => generateAIReply(email.id), 0);
                                    }}
                                >
                                    Generate smart reply
                                </button>
                                <button
                                    className="w-full py-2 rounded-xl text-sm font-medium bg-green-100 text-green-700"
                                    onClick={() => {
                                        markEmailCompleted(activeAgendaEmail.id);
                                        setShowEmailActionSheet(false);
                                        setActiveAgendaEmail(null);
                                    }}
                                >
                                    Mark completed
                                </button>
                                <button
                                    className="w-full py-2 rounded-xl text-sm font-medium bg-yellow-100 text-yellow-700"
                                    onClick={() => {
                                        snoozeEmailForToday(activeAgendaEmail.id);
                                        setShowEmailActionSheet(false);

                                                )}
                                                <div
                                                    className={`rounded-2xl p-4 border relative cursor-pointer ${darkMode ? 'bg-gray-800/50' : 'bg-white/50'}`}
                                                    onClick={() => setActiveEvent(event)}
                                                >
                                                    <div className="flex justify-between items-start">
                                                        <div className="flex-1">
                                                            <h3 className="text-sm font-bold">
                                                                {event.title}
                                                                {event.doneToday && (
                                                                    <span className="ml-2 text-xs text-green-600">(done)</span>
                                                                )}
                                                            </h3>
                                                            <p className="text-xs text-gray-500 mt-1">
                                                                🕐 {formatTime(event.start)}
                                                            </p>
                                                            {event.location && (
                                                                <p className="text-xs text-gray-500 mt-1">
                                                                    📍 {event.location}
                                                                </p>
                                                            )}
                                                        </div>
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                deleteEvent(event.id);
                                                            }}
                                                            className="text-red-500 hover:bg-red-50 p-2 rounded-lg ml-2 text-xs">
                                                            🗑️
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                            </div>
                        )}
                    </div>
                )}

                <div
                    className={`fixed bottom-0 left-0 right-0 border-t backdrop-blur-xl ${darkMode ? 'bg-gray-900/95 border-gray-800' : 'bg-white/95 border-gray-200'}`}>
                    <div className="flex justify-around p-3">
                        <button
                            onClick={() => setScreen('agenda')}
                            className={`flex flex-col items-center ${screen === 'agenda' ? 'text-blue-500' : 'text-gray-400'}`}>
                            <span className="text-xl">📋</span>
                            <span className="text-[10px] mt-1">Agenda</span>
                        </button>
                        <button
                            onClick={() => setScreen('inbox')}
                            className={`flex flex-col items-center ${screen === 'inbox' ? 'text-blue-500' : 'text-gray-400'}`}>
                            <span className="text-xl">📧</span>
                            <span className="text-[10px] mt-1">Inbox</span>
                        </button>
                        <button
                            onClick={() => setScreen('tasks')}
                            className={`flex flex-col items-center ${screen === 'tasks' ? 'text-blue-500' : 'text-gray-400'}`}>
                            <span className="text-xl">✅</span>
                            <span className="text-[10px] mt-1">Tasks</span>
                        </button>
                        <button
                            onClick={() => setScreen('calendar')}
                            className={`flex flex-col items-center ${screen === 'calendar' ? 'text-blue-500' : 'text-gray-400'}`}>
                            <span className="text-xl">📅</span>
                            <span className="text-[10px] mt-1">Calendar</span>
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
